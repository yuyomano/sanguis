version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sanguis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sanguis
      POSTGRES_PASSWORD: sanguis_dev_password
      POSTGRES_DB: sanguis_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sanguis_redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: sanguis_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://sanguis:sanguis_dev_password@postgres:5432/sanguis_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change_this_in_production
      JWT_REFRESH_SECRET: change_this_refresh_in_production
      PORT: 3001
    ports:
      - '3001:3001'
    volumes:
      - ./api:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: sanguis_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - '3000:3000'
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
